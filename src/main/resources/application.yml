spring:
  application:
    name: car-rental-application
  
  datasource:
    url: jdbc:h2:mem:carrentdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # For PostgreSQL (uncomment when using PostgreSQL)
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/carrentdb
  #   username: postgres
  #   password: postgres
  # jpa:
  #   properties:
  #     hibernate:
  #       dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    com.carrent: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
